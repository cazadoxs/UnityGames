# Pruebas dentro de Unity con GameCI. Solo manual hasta tener la licencia de Unity en los secrets
# (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD). Ver Docs/PendienteDeVerificar.md, paso 6.
name: Unity

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: Estandartes/Library
          key: Library-${{ hashFiles('Estandartes/Assets/**', 'Estandartes/Packages/**', 'Estandartes/ProjectSettings/**') }}
          restore-keys: Library-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Estandartes
          testMode: all
          githubToken: ${{ secrets.GITHUB_TOKEN }}
